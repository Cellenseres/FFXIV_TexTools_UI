name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: msbuild FFXIV_TexTools.sln /p:Configuration=Release /p:Platform="Any CPU" /m /restore

      - name: Create zip
        run: Compress-Archive -Path bin/Release/* -DestinationPath "FFXIV_TexTools_${{ github.ref_name }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "FFXIV_TexTools_${{ github.ref_name }}.zip"
          generate_release_notes: true
